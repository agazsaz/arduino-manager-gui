name: Release Arduino Manager GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: arduino-manager-gui
            asset_name: arduino-manager-gui-linux
          - os: windows-latest
            artifact_name: arduino-manager-gui.exe
            asset_name: arduino-manager-gui-windows.exe
          - os: macos-latest
            artifact_name: arduino-manager-gui
            asset_name: arduino-manager-gui-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev libgtk-3-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Download dependencies
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -v -o ${{ matrix.artifact_name }} main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/arduino-manager-gui-linux/*
            artifacts/arduino-manager-gui-windows.exe/*
            artifacts/arduino-manager-gui-macos/*
          generate_release_notes: true
